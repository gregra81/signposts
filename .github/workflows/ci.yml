name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:00 UTC. Scheduled runs only fire on the default branch, which is the
    # point: this is the cold, uncached mutation run that backstops the cached
    # ones on pull requests.
    - cron: "0 3 * * *"

# `verify` is split into parallel jobs rather than run as one script: mutation
# testing dominates the wall clock, and there is no reason typecheck, lint, and
# the test suite should queue behind it. Every job repeats the same setup, which
# the pnpm store cache makes cheap.
jobs:
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      # The installer is the first thing a user runs: it is shell, it is piped
      # into bash, and a typo in it fails on their machine rather than in this
      # repo. The install test in the test job runs it; this lints both.
      - run: shellcheck docs/install.sh test/install/install.test.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      # Outside `pnpm test` because it packs, and packing writes dist/ into the
      # checkout that the suite's spawned processes are running from.
      - run: pnpm run test:install

  # The mod (mod/) compiles against Claude Code's own API, not this repo's
  # toolchain, so typecheck, lint and vitest never see it. `validate` reads both
  # plugins' manifests, the marketplace and the hooks module the way the engine
  # will; `test` runs the mod's own tests. Pinned, because the mod API is early
  # access and moves between releases: a bump here is a deliberate step.
  mod:
    name: plugins + mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # It reads `packageManager` and looks for pnpm, which this job never uses.
          package-manager-cache: false
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate .
      - run: claude plugin validate mod
      - run: claude plugin test mod
