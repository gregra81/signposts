name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:00 UTC. Scheduled runs only fire on the default branch, which is the
    # point: this is the cold, uncached mutation run that backstops the cached
    # ones on pull requests.
    - cron: "0 3 * * *"

# `verify` is split into parallel jobs rather than run as one script: mutation
# testing dominates the wall clock, and there is no reason typecheck, lint, and
# the test suite should queue behind it. Every job repeats the same setup, which
# the pnpm store cache makes cheap.
jobs:
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      # The installer is the first thing a user runs and the one file here that
      # no test exercises: it is shell, it is piped into bash, and a typo in it
      # fails on their machine rather than in this repo.
      - run: shellcheck docs/install.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
