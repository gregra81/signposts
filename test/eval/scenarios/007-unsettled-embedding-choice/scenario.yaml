# unsettled-embedding-choice
#
# A contradiction nobody settles: the resolver cannot pick, so the operation is
# held under the `unresolved_contradiction` gate reason rather than applied on
# its own authority.
#
# The session is written so the human explicitly declines to decide and says
# so, because that is the honest shape of this case: an unresolved
# contradiction is not a failure to extract, it is a reason to ask a person.
#
# Re-recorded 2026-09-19, and the expectations below follow that recording.
# Between 2026-09-18 and this recording the scenario covered nothing: step 1
# produced nothing, so step 2 saw an empty mirror and `resolve_conflict` was
# never reached. The cause was not the critic rejecting the privacy claim — it
# kept that one and rejected the other three, which is over CRITIC_REJECT_RATIO,
# so the batch went back to `extract` with a critique that named only the
# rejections and told it to be stricter. The retry returned an empty list and
# the kept claim went with it. The critique now carries the kept claims too
# (19-value-to-a-user.md, "Follow-up: scenario 007").
repo: gregra81/signposts

steps:
  - transcript: 01-establish.jsonl
    intent: "local embeddings chosen, with the privacy reason as the load-bearing part"
    # One claim, not the three earlier recordings produced: the critic still
    # rejects the bare "embeddings run locally", which CLAUDE.md already says,
    # and keeps the reason, which it does not.
    expect_operations: [add]
    expect_mirror_size: 1
    expect_claims:
      - "Embeddings run locally rather than through a hosted API, because transcripts hold what people said in private and sending them to a third party is a disclosure nobody consented to."

  - transcript: 02-unsettled.jsonl
    intent: "speed argues the other way; the human refuses to settle it"
    # The step this scenario exists for. The new claim contradicts step 1's, the
    # resolver returns `undecidable`, and the `add` is held under the
    # `unresolved_contradiction` gate reason. The `reinforce` is step 1's claim
    # meeting the same decision a second time.
    expect_operations: [add, reinforce]
    expect_mirror_size: 2
    expect_claims:
      - "Whether to keep local embeddings for privacy or move to a hosted API for speed is deliberately left undecided."
